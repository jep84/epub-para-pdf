<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de EPUB para PDF</title>
    <style>
        /* Força o navegador a tratar a página como modo claro, ignorando o tema escuro do SO */
        :root {
            color-scheme: light;
        }

        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 50px auto; 
            padding: 20px; 
            text-align: center; 
            background: #f4f4f9; 
            color: #333; /* Garante texto escuro no fundo claro */
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        input[type="file"] { margin: 20px 0; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Conversor de EPUB para PDF</h2>
        <p>Selecione seu arquivo EPUB para converter instantaneamente.</p>
        <form action="/convert" method="POST" enctype="multipart/form-data">
            <input type="file" name="epub_file" accept=".epub" required><br>
            <button type="submit">Converter para PDF</button>
        </form>
    </div>
</body>
</html>
